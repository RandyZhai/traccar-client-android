name: Build APK

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create placeholder google-services.json
        run: |
          echo '{"project_info":{"project_number":"000000000000","project_id":"dummy"},"client":[],"configuration_version":"1"}' > app/google-services.json

      - name: Build regularDebug APK
        run: ./gradlew assembleRegularDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: traccar-client-debug
          path: app/build/outputs/apk/regular/debug/app-regular-debug.apk